<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Game Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.16)" stroke-width="12" stroke-linecap="round">
    <line x1="184" y1="96" x2="184" y2="416"/>
    <line x1="328" y1="96" x2="328" y2="416"/>
    <line x1="96" y1="184" x2="416" y2="184"/>
    <line x1="96" y1="328" x2="416" y2="328"/>
  </g>

  <!-- X Symbol (Glowing Indigo) -->
  <g filter="url(#glow)">
    <line x1="116" y1="116" x2="164" y2="164" stroke="url(#xGrad)" stroke-width="16" stroke-linecap="round"/>
    <line x1="164" y1="116" x2="116" y2="164" stroke="url(#xGrad)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- O Symbol (Glowing Rose) -->
  <circle cx="372" cy="140" r="24" fill="none" stroke="url(#oGrad)" stroke-width="14" filter="url(#glow)"/>

  <!-- Center Controller / Spark (Gamepad & Lightning) -->
  <g transform="translate(256, 256)">
    <circle r="44" fill="#1e1b4b" stroke="url(#primaryGlow)" stroke-width="6" filter="url(#glow)"/>
    <path d="M-18 -8 L0 -24 L18 -8 L12 18 L-12 18 Z" fill="url(#primaryGlow)"/>
    <polygon points="0,-16 -10,4 2,4 -4,16 12,-2 0,-2" fill="#ffffff"/>
  </g>

  <!-- Bottom Cross & Circle Symbols -->
  <circle cx="140" cy="372" r="24" fill="none" stroke="url(#oGrad)" stroke-width="14" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <line x1="348" y1="348" x2="396" y2="396" stroke="url(#xGrad)" stroke-width="16" stroke-linecap="round"/>
    <line x1="396" y1="348" x2="348" y2="396" stroke="url(#xGrad)" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
