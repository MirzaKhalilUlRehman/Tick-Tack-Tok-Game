<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="primaryGlowMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="xGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="oGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- Maskable full background (safe zone is inner 80%) -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Inner safe zone content -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Grid Lines -->
    <g stroke="rgba(255, 255, 255, 0.2)" stroke-width="14" stroke-linecap="round">
      <line x1="184" y1="96" x2="184" y2="416"/>
      <line x1="328" y1="96" x2="328" y2="416"/>
      <line x1="96" y1="184" x2="416" y2="184"/>
      <line x1="96" y1="328" x2="416" y2="328"/>
    </g>

    <!-- X Symbol -->
    <line x1="116" y1="116" x2="164" y2="164" stroke="url(#xGradMask)" stroke-width="18" stroke-linecap="round"/>
    <line x1="164" y1="116" x2="116" y2="164" stroke="url(#xGradMask)" stroke-width="18" stroke-linecap="round"/>

    <!-- O Symbol -->
    <circle cx="372" cy="140" r="26" fill="none" stroke="url(#oGradMask)" stroke-width="16"/>

    <!-- Center Badge -->
    <circle cx="256" cy="256" r="48" fill="#1e1b4b" stroke="url(#primaryGlowMask)" stroke-width="8"/>
    <polygon points="256,226 242,254 258,254 250,284 272,250 256,250" fill="#ffffff"/>

    <circle cx="140" cy="372" r="26" fill="none" stroke="url(#oGradMask)" stroke-width="16"/>
    <line x1="348" y1="348" x2="396" y2="396" stroke="url(#xGradMask)" stroke-width="18" stroke-linecap="round"/>
    <line x1="396" y1="348" x2="348" y2="396" stroke="url(#xGradMask)" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
